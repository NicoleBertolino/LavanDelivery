{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lavandelivery{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="container mx-auto px-4 py-12">
        <nav class="flex items-center justify-between">
            <a href="{% url 'index' %}">LavanDelivery</a>

            <div class="flex gap-4">
                <a href="{% url 'index' %}">Início</a>
                <a href="#">Planos</a>
                <a href="#">Entrar</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="container mx-auto px-6 py-12 text-center text-slate-500 text-sm">
        <p>© {% now "Y" %} LavanDelivery · Ouro Preto</p>
        <p>Projeto da disciplina de Programação Web</p>
    </footer>
</body>
</html>
