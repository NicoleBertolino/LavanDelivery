{% if form.non_field_errors %}
<div class="alert-erro" role="alert">{{ form.non_field_errors.0 }}</div>
{% endif %}

{% for field in form %}
<div class="mb-4">
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-soft">{{ field.help_text }}</p>{% endif %}
    {% for erro in field.errors %}<p class="mt-1 text-xs font-medium text-alerta">{{ erro }}</p>{% endfor %}
</div>
{% endfor %}
